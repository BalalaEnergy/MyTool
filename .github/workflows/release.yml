name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: ./build.ps1
      - name: Test
        shell: powershell
        run: |
          $p = Start-Process ./MyTool.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content ./test-results.txt
          if ($p.ExitCode -ne 0) { throw 'Tests failed' }
          (Get-FileHash ./MyTool.exe -Algorithm SHA256).Hash.ToLower() + '  MyTool.exe' | Set-Content SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MyTool-Windows
          path: |
            MyTool.exe
            SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "MyTool $env:GITHUB_REF_NAME" --notes 'Windows 个人工具箱：JSON 格式化与 JSON Diff。下载 MyTool.exe 即可运行。'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:GITHUB_REF_NAME MyTool.exe SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
